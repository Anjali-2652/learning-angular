<!-- two ways to call methods ........ -->
 <!-- 1. -->
<p class="font-bold">two ways to call methods </p>
<p class="font-semibold">1. string-interpolation works!</p>

<!-- // extract the normal variable data  -->
<h1>name is {{name}}</h1>
<h2>email is {{email}}</h2>

<!-- do the arithmetic operation  or expression -->
<p>2+2 = {{2+2}}</p>

<!-- call the method -->
<p>{{getDisplay()}}</p>

<!-- 2.  -->
 <p class="font-semibold mt-4">2. using event</p>

<p><button (click)="Display()">click here</button></p>
